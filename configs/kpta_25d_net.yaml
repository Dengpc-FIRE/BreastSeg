train:
  train_path: "./processed_25d_dce/train"
  val_path: "./processed_25d_dce/val"
  test_path: "./processed_25d_dce/test"
  output_path: "./results_kpta_25d_net"
  epochs: 400
  batch_size: 4
  lr: 0.0001
  num_workers: 4

dataset:
  type: "breastdm_25d"
  img_size: 256

model:
  name: "kpta_25d_net"
  in_phases: 17
  num_slices: 3
  base_channels: 32
  phase_indices:
    pre: 0
    post: [1, 2, 3, 4, 5, 6, 7, 8]
    subtraction: [9, 10, 11, 12, 13, 14, 15, 16]
  kinetic_maps:
    - sub_stack
    - peak_enhancement
    - mean_enhancement
    - temporal_std
    - early_enhancement
    - late_enhancement
  normalize_after_kinetic: true
  normalize_kinetic: true
  slice_context_mode: "attention"
  phase_attention: true
  use_uncertainty_head: true
  use_boundary_head: true
  use_uncertainty_refinement: true
  return_dict: true
  hybrid_encoder:
    stem_type: "resblock"
    bottleneck_type: "swin"
    transformer_depth: 2
    window_size: 7
    num_heads: 4

loss:
  name: "kpta_25d_loss"
  bce_weight: 0.5
  lambda_boundary: 0.2
  lambda_uncertainty: 0.1
  lambda_attention_smooth: 0.01
  boundary_thickness: 3

ablation:
  disable_kinetic_maps: false
  disable_slice_context: false
  disable_pixelwise_phase_attention: false
  disable_transformer_bottleneck: false
  disable_uncertainty_refinement: false
  disable_boundary_head: false
  disable_uncertainty_head: false
  disable_attention_smooth_loss: false
