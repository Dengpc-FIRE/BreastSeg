train:
  train_path: "./processed_25d_dce/train"
  val_path: "./processed_25d_dce/val"
  test_path: "./processed_25d_dce/test"
  output_path: "./results_kpta_25d_net_no_kinetic"
  epochs: 100
  batch_size: 8
  lr: 0.0003
  num_workers: 4

dataset:
  type: "breastdm_25d"
  img_size: 256

model:
  name: "kpta_25d_net"

  # 原始输入仍然保留 17 个 phase：
  # 0: pre
  # 1-8: post
  # 9-16: subtraction
  # 这里不是完全不用 C_sub，而是不用额外 pseudo-kinetic branch。
  in_phases: 17
  num_slices: 3
  base_channels: 32

  phase_indices:
    pre: 0
    post: [1, 2, 3, 4, 5, 6, 7, 8]
    subtraction: [9, 10, 11, 12, 13, 14, 15, 16]

  # 关闭 kinetic branch 后，这里即使保留也不会真正使用。
  # 为了配置完整性先保留，但 ablation.disable_kinetic_maps=true 会禁用。
  kinetic_maps:
    - peak_enhancement
    - mean_enhancement
    - temporal_std
    - early_enhancement
    - late_enhancement

  normalize_after_kinetic: true
  normalize_kinetic: false

  # Slice 维度：保留 CSAM，用于 2.5D 相邻切片融合
  slice_context_mode: "attention"
  slice_attention_type: "csam"
  csam_aggregate: "center"
  csam_uncertainty: false

  # Phase 维度：使用轻量 PDWA，但不使用 kinetic_feature
  # 只让它基于 raw phase feature 和已有 C_sub 做时相选择
  phase_attention_type: "pdwa"
  use_enhancement_prior: true
  use_kinetic_bias: false
  use_difference_refinement: false
  residual_mean_weight: 0.5
  lambda_enh_init: 1.0
  gamma_diff_init: 0.0

  phase_attention: true

  # 先关闭 uncertainty refinement，避免边界细化模块干扰主分割
  use_uncertainty_head: false
  use_boundary_head: true
  use_uncertainty_refinement: false

  return_dict: true

  # 先关闭 Swin bottleneck，跑稳后再打开
  hybrid_encoder:
    stem_type: "resblock"
    bottleneck_type: "none"
    transformer_depth: 0
    window_size: 7
    num_heads: 4

loss:
  name: "kpta_25d_loss"

  # BCE 不要太大，Dice 仍然作为主损失
  bce_weight: 0.5

  # 原来 0.2 偏大，容易让边界任务干扰主分割
  lambda_boundary: 0.05

  # 已关闭 uncertainty refinement，这里设为 0
  lambda_uncertainty: 0.0

  # 先关闭 attention smooth，避免限制 PDWA 学习
  lambda_attention_smooth: 0.0

  boundary_thickness: 3

ablation:
  # 核心：关闭 pseudo-kinetic maps / kinetic branch
  disable_kinetic_maps: true

  # 保留 CSAM slice attention
  disable_slice_context: false

  # 保留 phase attention
  disable_pixelwise_phase_attention: false

  # 关闭 kinetic raw fusion，因为现在不用 kinetic branch
  disable_kinetic_raw_fusion: true

  # 先关闭 transformer / Swin，跑一个更稳的 CNN 版本
  disable_transformer_bottleneck: true

  # 关闭 uncertainty refinement
  disable_uncertainty_refinement: true

  # 保留 boundary head，但降低 loss 权重
  disable_boundary_head: false

  # 关闭 uncertainty head
  disable_uncertainty_head: true

  # 关闭 attention smooth loss
  disable_attention_smooth_loss: true