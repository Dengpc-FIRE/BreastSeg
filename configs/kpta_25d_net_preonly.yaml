train:
  train_path: "./processed_25d_dce/train"
  val_path: "./processed_25d_dce/val"
  test_path: "./processed_25d_dce/test"
  output_path: "./results_kpta_25d_net"
  epochs: 100
  batch_size: 4
  lr: 0.0002
  num_workers: 4

early_stopping:
  enabled: true
  patience: 20
  min_delta: 0.0001
  start_epoch: 40

dataset:
  type: "breastdm_25d"
  img_size: 256
  input_phase_indices: [0]  

scheduler:
  enabled: true
  name: "reduce_on_plateau"
  factor: 0.5
  patience: 10
  threshold: 0.0001
  threshold_mode: "abs"
  cooldown: 0
  min_lr: 0.000001

model:
  name: "kpta_25d_net"
  in_phases: 1
  num_slices: 3
  base_channels: 32
  phase_indices:
    pre: 0
    post: []
    subtraction: []
  kinetic_maps:
    - peak_enhancement
    - mean_enhancement
    - temporal_std
    - early_enhancement
    - late_enhancement
  normalize_after_kinetic: true
  normalize_kinetic: true
  slice_context_mode: "attention"
  slice_attention_type: "csam"
  csam_aggregate: "center"
  csam_uncertainty: false
  phase_attention_type: "pdwa"
  use_enhancement_prior: false
  use_kinetic_bias: false
  use_difference_refinement: false
  residual_mean_weight: 0.0
  lambda_enh_init: 1.0
  gamma_diff_init: 0.5
  phase_attention: true
  use_uncertainty_head: true
  use_boundary_head: true
  use_uncertainty_refinement: true
  return_dict: true
  hybrid_encoder:
    stem_type: "resblock"
    bottleneck_type: "swin"
    transformer_depth: 2
    window_size: 7
    num_heads: 4

loss:
  name: "kpta_25d_loss"
  bce_weight: 0.3
  lambda_boundary: 0.05
  lambda_uncertainty: 0.0125
  lambda_attention_smooth: 0.0
  boundary_thickness: 4

ablation:
  disable_kinetic_maps: true
  disable_slice_context: false
  disable_pixelwise_phase_attention: true
  disable_kinetic_raw_fusion: true
  disable_transformer_bottleneck: false
  disable_uncertainty_refinement: false
  disable_boundary_head: false
  disable_uncertainty_head: false
  disable_attention_smooth_loss: true
