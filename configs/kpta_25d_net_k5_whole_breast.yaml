train:
  train_path: "./processed_25d_dce_k5/train"
  val_path: "./processed_25d_dce_k5/val"
  test_path: "./processed_25d_dce_k5/test"
  output_path: "./results_kpta_25d_net_k5"
  epochs: 100
  batch_size: 4
  lr: 0.0002
  num_workers: 4

dataset:
  type: "breastdm_25d"
  img_size: 256

# This section is used only by validation/test inference. It is never read by
# the tumor Dataset, tumor model, loss, optimizer, or training forward pass.
whole_breast:
  enabled: true
  backend: "nnunet_v1"
  model_folder: "./nnUNet/3d_fullres/Task555_breast/nnUNetTrainerV2__nnUNetPlansv2.1"
  folds: [0]
  checkpoint_name: "model_best"

  # Reconstruct the complete 3D pre-contrast volume from raw BreastDM when
  # available. If unavailable, the adapter falls back to processed 2.5D data.
  raw_data_root: "./seg"
  raw_pre_dir_name: "VIBRANT"
  pre_phase_index: 0

  # The bundled checkpoint is one-channel 3D nnU-Net with nonCT z-score
  # normalization and identity axis transpose according to its plans.
  normalization: "nnunet_nonct"
  normalize_nonzero_only: false
  clip_percentiles: [0.5, 99.5]
  transpose_axes: [0, 1, 2]
  flip_axes: []

  foreground_class: 1
  breast_threshold: 0.5
  tumor_threshold: 0.5
  step_size: 0.5
  use_gaussian: true
  do_mirroring: false
  mixed_precision: true

  # Slightly enlarge the breast ROI to avoid clipping peripheral tumors under
  # cross-dataset/domain mismatch. Dilation is in-plane only by default.
  dilation_pixels: 5
  dilation_slices: 0

  # Safety checks: an implausible or empty mask must not erase tumor output.
  min_breast_fraction: 0.01
  max_breast_fraction: 0.95
  invalid_mask_policy: "full_mask"
  runtime_failure_policy: "error"
  verbose: true

  # Each case is inferred once. Repeated validation epochs reuse this cache.
  cache:
    enabled: true
    dir: "./results_kpta_25d_net/whole_breast_cache"

scheduler:
  enabled: true
  name: "reduce_on_plateau"
  factor: 0.5
  patience: 10
  threshold: 0.0001
  threshold_mode: "abs"
  cooldown: 0
  min_lr: 0.000001

model:
  name: "kpta_25d_net"
  in_phases: 17
  num_slices: 5
  base_channels: 32
  phase_indices:
    pre: 0
    post: [1, 2, 3, 4, 5, 6, 7, 8]
    subtraction: [9, 10, 11, 12, 13, 14, 15, 16]
  kinetic_maps:
    - peak_enhancement
    - mean_enhancement
    - temporal_std
    - early_enhancement
    - late_enhancement
  normalize_after_kinetic: true
  normalize_kinetic: true
  slice_context_mode: "attention"
  slice_attention_type: "csam"
  csam_aggregate: "center"
  csam_uncertainty: false
  phase_attention_type: "pdwa"
  use_enhancement_prior: true
  use_kinetic_bias: true
  use_difference_refinement: true
  residual_mean_weight: 0.5
  lambda_enh_init: 1.0
  gamma_diff_init: 0.5
  phase_attention: true
  use_uncertainty_head: true
  use_boundary_head: true
  use_uncertainty_refinement: true
  return_dict: true
  hybrid_encoder:
    stem_type: "resblock"
    bottleneck_type: "swin"
    transformer_depth: 2
    window_size: 7
    num_heads: 4

loss:
  name: "kpta_25d_loss"
  bce_weight: 0.5
  lambda_boundary: 0.2
  lambda_uncertainty: 0.05
  lambda_attention_smooth: 0.005
  boundary_thickness: 1

ablation:
  disable_kinetic_maps: false
  disable_slice_context: false
  disable_pixelwise_phase_attention: false
  disable_kinetic_raw_fusion: false
  disable_transformer_bottleneck: false
  disable_uncertainty_refinement: false
  disable_boundary_head: false
  disable_uncertainty_head: false
  disable_attention_smooth_loss: false

