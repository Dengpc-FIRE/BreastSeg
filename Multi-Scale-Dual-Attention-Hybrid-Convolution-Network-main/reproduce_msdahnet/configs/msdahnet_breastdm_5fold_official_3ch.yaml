experiment:
  name: "msdahnet_breastdm_5fold_official_3ch"
  seed: 42
  device: "cuda"

data:
  dataset: "BreastDM"
  image_dir: "./reproduce_msdahnet/BreastDM/pre_contrast_images"
  mask_dir: "./reproduce_msdahnet/BreastDM/masks"
  source_processed_17ch_dir: "../processed_17ch_dce"
  image_size: 256
  original_size: 369
  mode: "L"
  in_channels: 3
  gray_to_rgb: true
  normalize: "minmax_0_1"
  mask_threshold: 0
  convert_from_processed_17ch: false

cross_validation:
  n_splits: 5
  split_level: "patient"
  shuffle: true
  seed: 42
  save_splits: true

model:
  name: "MSDAHNet"
  in_channels: 3
  num_classes: 1

train:
  epochs: 100
  batch_size: 8
  optimizer: "Adam"
  lr: 0.001
  scheduler: "ReduceLROnPlateau"
  scheduler_mode: "max"
  scheduler_monitor: "val_dice"
  scheduler_patience: 5
  num_workers: 4
  save_best_by: "val_dice"

loss:
  name: "DiceBCE"
  implementation: "official"
  dice_weight: 1.0
  bce_weight: 1.0

eval:
  threshold: 0.5
  metrics:
    - dice
    - iou
    - recall
    - precision
    - accuracy
    - hd
  empty_mask_policy: "explicit"
  hd_empty_value: 256.0

output:
  output_dir: "./reproduce_msdahnet/results_msdahnet_breastdm_5fold_official_3ch"
  save_predictions: true
  save_logs: true

paper_reported:
  dice: 0.832
  iou: 0.745
  recall: 0.775
  precision: 0.946
  accuracy: 0.999
  hd: 1.715
