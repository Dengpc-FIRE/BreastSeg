model:
  name: pytorch_unet
  input_channels: 17
  out_channels: 1
  pretrained: false
data:
  mode: 2d
  train_path: ../../../processed_mama_nact_17ch/train
  val_path: ../../../processed_mama_nact_17ch/val
  test_path: ../../../processed_mama_nact_17ch/test
  image_size: [256, 256]
  normalize: zscore
train:
  epochs: 100
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.00001
  num_workers: 4
  early_stopping: 0
  scheduler: reduce_on_plateau
  amp: true
  seed: 2026
eval:
  threshold: 0.5
  save_predictions: false
output:
  checkpoint_dir: mama_nact_checkpoints
  test_dir: mama_nact_test_results
  log_file: mama_nact_training_log.csv

