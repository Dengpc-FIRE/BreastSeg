model:
  name: plhn
  input_channels: 17
  out_channels: 1
  pretrained: false
  base_channels: 32
  hidden_size: 192
  transformer_layers: 4
  output_index: 2
  pass_target: false
  use_prototype: false
  update_prototype: false
  use_prototype_loss: false
data:
  mode: 3d
  raw_dataset_root: ../../../processed_mama_nact_3d
  cache_root: ../../dataset/processed_mama_nact_3d/plhn
  patch_size: [16, 128, 128]
  samples_per_volume: 4
  positive_crop_prob: 0.7
  normalize: zscore
  label_phase:
  allow_missing_phases: false
train:
  epochs: 100
  batch_size: 1
  lr: 0.0001
  weight_decay: 0.00001
  num_workers: 2
  early_stopping: 30
  scheduler: reduce_on_plateau
  scheduler_patience: 8
  scheduler_factor: 0.5
  min_lr: 0.000001
  amp: true
  seed: 2026
  extra_loss_weight: 0.0
  max_grad_norm: 1.0
  collapse_guard: true
  collapse_ratio: 0.25
  collapse_min_epoch: 5
  collapse_min_best: 0.05
  collapse_lr_factor: 0.2
  collapse_stop_after: 3
eval:
  threshold: 0.5
  save_predictions: false
  sliding_window_overlap: 0.5
output:
  checkpoint_dir: mama_nact_checkpoints
  test_dir: mama_nact_test_results
  log_file: mama_nact_training_log.csv

