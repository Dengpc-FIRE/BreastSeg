model:
  name: plhn
  input_channels: 17
  out_channels: 1
  pretrained: false
  base_channels: 32
  hidden_size: 256
  transformer_layers: 8
data:
  mode: 3d
  train_path: ../../../processed_cc_tumor_heterogeneity_17ch_2d/train
  val_path: ../../../processed_cc_tumor_heterogeneity_17ch_2d/val
  test_path: ../../../processed_cc_tumor_heterogeneity_17ch_2d/test
  raw_dataset_root: ../../../processed_cc_tumor_heterogeneity_17ch_3d_raw
  cache_root: ../../dataset/processed_3d_cc_tumor_heterogeneity_17ch/plhn
  phase_names: [PRE, POST1, POST2, POST3, POST4, POST5, POST6, POST7, POST8, SUB1, SUB2, SUB3, SUB4, SUB5, SUB6, SUB7, SUB8]
  label_phase: GT
  image_size: [256, 256]
  patch_size: [48, 128, 128]
  samples_per_volume: 4
  positive_crop_prob: 0.7
  normalize: zscore
  allow_missing_phases: false
train:
  epochs: 100
  batch_size: 1
  lr: 0.00002
  weight_decay: 0.0001
  num_workers: 2
  early_stopping: 0
  amp: false
  seed: 2026
  max_grad_norm: 1.0
eval:
  threshold: 0.5
  sliding_window_overlap: 0.5
output:
  checkpoint_dir: checkpoints_cc_tumor_heterogeneity_17ch
  test_dir: test_results_cc_tumor_heterogeneity_17ch
  log_file: training_log_cc_tumor_heterogeneity_17ch.csv
