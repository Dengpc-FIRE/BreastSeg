model:
  name: transunet
  input_channels: 1
  out_channels: 1
  pretrained: false
  vit_name: R50-ViT-B_16
  n_skip: 3
  vit_patches_size: 16
  transformer_layers: 6
  dropout_rate: 0.1
  attention_dropout_rate: 0.0
  decoder_channels:
  - 256
  - 128
  - 64
  - 16
data:
  mode: 2d
  train_path: ../../../processed_17ch_dce/train
  val_path: ../../../processed_17ch_dce/val
  test_path: ../../../processed_17ch_dce/test
  raw_dataset_root: ../../../seg
  image_size:
  - 256
  - 256
  normalize: zscore
  input_phase_indices:
  - 2
train:
  epochs: 100
  batch_size: 4
  lr: 0.0001
  weight_decay: 1.0e-05
  num_workers: 4
  early_stopping: 0
  scheduler: reduce_on_plateau
  amp: true
  seed: 2026
eval:
  threshold: 0.5
  save_predictions: false
output:
  checkpoint_dir: checkpoints_preonly
  test_dir: test_results_preonly
  log_file: training_log_preonly.csv
