model:
  name: msdahnet
  input_channels: 56
  out_channels: 1
  pretrained: false
data:
  mode: 2d
  train_path: ../../../processed_headneck_dce_56ch_2d/train
  val_path: ../../../processed_headneck_dce_56ch_2d/val
  test_path: ../../../processed_headneck_dce_56ch_2d/test
  image_size: [256, 256]
  normalize: zscore
train:
  epochs: 100
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.00001
  num_workers: 4
  early_stopping: 30
  amp: true
  seed: 2026
eval:
  threshold: 0.5
output:
  checkpoint_dir: checkpoints_headneck_dce_56ch
  test_dir: test_results_headneck_dce_56ch
  log_file: training_log_headneck_dce_56ch.csv

