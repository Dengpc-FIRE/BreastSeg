model:
  name: hcrt
  input_channels: 17
  out_channels: 1
  pretrained: false
  base_channels: 32
  hidden_size: 256
data:
  mode: 3d
  raw_dataset_root: ../../../processed_mama_nact_3d
  cache_root: ../../dataset/processed_mama_nact_3d/hcrt
  patch_size: [48, 128, 128]
  samples_per_volume: 4
  positive_crop_prob: 0.7
  normalize: zscore
  label_phase:
  allow_missing_phases: false
train:
  epochs: 100
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.00001
  num_workers: 2
  early_stopping: 0
  scheduler: reduce_on_plateau
  amp: true
  seed: 2026
eval:
  threshold: 0.5
  save_predictions: false
  sliding_window_overlap: 0.5
output:
  checkpoint_dir: mama_nact_checkpoints
  test_dir: mama_nact_test_results
  log_file: mama_nact_training_log.csv

